[package]
name = "payment_router"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib produces the .wasm for on-chain deployment; rlib is required by
# cargo test / cargo tarpaulin so the test harness can link the crate.
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "20.0.0"
derive_arbitrary = "=1.3.2"

[patch.crates-io]
ethnum = { path = "ethnum-patch" }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
